    async function apiRequest(endpoint, method = 'GET', body = null) {
      const opts = {
        method,
        headers: { 'Content-Type': 'application/json', 'x-api-key': API_CONFIG.apiKey }
      };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(API_CONFIG.baseUrl + endpoint, opts);
      if (!res.ok) throw new Error('API Error: ' + res.status);
      return res.json();
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return { ...DEFAULT_STATE, ...parsed };
        }
      } catch (e) { /* ignore storage errors */ }
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) { /* ignore storage errors */ }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const id = 'toast-' + Date.now();
      const colors = type === 'error'
        ? 'bg-red-800 border-red-900 text-white'
        : type === 'info'
        ? 'bg-slate-800 border-slate-900 text-white'
        : 'bg-emerald-800 border-emerald-900 text-white';
      const el = document.createElement('div');
      el.id = id;
      el.className = `${colors} border px-4 py-3 rounded shadow-lg text-sm font-medium flex items-center justify-between gap-3 transition-opacity duration-300`;
      el.innerHTML = `<span>${escapeHtml(message)}</span><button type="button" class="text-white/80 hover:text-white font-bold" onclick="this.parentElement.remove()">&times;</button>`;
      container.appendChild(el);
      setTimeout(() => {
        if (el.parentElement) el.remove();
      }, 3800);
    }

    function openModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      content.innerHTML = html;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('Starter code copied to clipboard!');
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Starter code copied to clipboard!');
      } catch (e) {
        showToast('Please select and copy the code manually.', 'info');
      }
      ta.remove();
    }

    function openStarterCodeModal() {
      const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      openModal(`
        <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
          <div>
            <h3 class="font-serif-college text-lg font-bold text-navy">MPGI Hosteler's ERP — Starter &amp; Full Code</h3>

          </div>

          <button type="button" id="btn-copy-starter" class="px-3.5 py-1.5 bg-navy hover:bg-navy-dark text-white text-xs font-semibold rounded">

          </button>

          </button>

      `);
      document.getElementById('btn-copy-starter').addEventListener('click', () => {
        copyTextToClipboard(STARTER_TEMPLATE_SNIPPET);
      });
      document.getElementById('btn-download-full').addEventListener('click', () => {
        const blob = new Blob([fullHtml], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mpgi_hostel_erp.html';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Downloaded mpgi_hostel_erp.html');
      });
    }

    function getStudentAttendanceStats(studentId) {
      const dates = Object.keys(state.attendanceRecords).sort().reverse();
      let present = 0, absent = 0, leave = 0, total = 0;
      const history = [];
      for (const d of dates) {
        const rec = state.attendanceRecords[d][studentId];
        if (rec) {
          total++;
          if (rec === 'Present') present++;
          else if (rec === 'Absent') absent++;
          else if (rec === 'Leave') leave++;
          history.push({ date: d, status: rec });
        }
      }
      const pct = total > 0 ? Math.round((present / total) * 100) : 0;
      return { present, absent, leave, total, pct, history };
    }

    function getStatusBadge(status) {
      if (status === 'Approved' || status === 'Present' || status === 'Allotted') {
        return `<span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200">${escapeHtml(status)}</span>`;
      }
      if (status === 'Rejected' || status === 'Absent' || status === 'Unassigned') {
        return `<span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-semibold bg-red-50 text-red-800 border border-red-200">${escapeHtml(status)}</span>`;
      }
      return `<span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-200">${escapeHtml(status)}</span>`;
    }

    function getActiveMealInfo() {
      const now = new Date();
      const hrs = now.getHours();
      const mins = now.getMinutes();
      const timeVal = hrs * 60 + mins;

      // 07:30 to 08:45 = Breakfast (450 to 525)
      // 13:00 to 14:15 = Lunch (780 to 855)
      // 17:00 to 17:45 = Snacks (1020 to 1065)
      // 19:30 to 21:15 = Dinner (1170 to 1275)
      if (timeVal >= 450 && timeVal <= 525) {
        return { meal: 'Breakfast', time: '07:30 AM – 08:45 AM', active: true, tag: 'Serving Now' };
      } else if (timeVal >= 780 && timeVal <= 855) {
        return { meal: 'Lunch', time: '01:00 PM – 02:15 PM', active: true, tag: 'Serving Now (Lunch Break)' };
      } else if (timeVal >= 1020 && timeVal <= 1065) {
        return { meal: 'Evening Tea & Snacks', time: '05:00 PM – 05:45 PM', active: true, tag: 'Serving Now' };
      } else if (timeVal >= 1170 && timeVal <= 1275) {
        return { meal: 'Dinner', time: '07:30 PM – 09:15 PM', active: true, tag: 'Serving Now' };
      } else if (timeVal < 450) {
        return { meal: 'Breakfast', time: '07:30 AM – 08:45 AM', active: false, tag: 'Next: Breakfast at 07:30 AM' };
      } else if (timeVal < 780) {
        return { meal: 'Lunch', time: '01:00 PM – 02:15 PM', active: false, tag: 'Next: Lunch Break at 01:00 PM' };
      } else if (timeVal < 1020) {
        return { meal: 'Evening Tea & Snacks', time: '05:00 PM – 05:45 PM', active: false, tag: 'Next: Refreshments at 05:00 PM' };
      } else if (timeVal < 1170) {
        return { meal: 'Dinner', time: '07:30 PM – 09:15 PM', active: false, tag: 'Next: Dinner at 07:30 PM' };
      } else {
        return { meal: 'Gate Curfew & Silence', time: '10:00 PM – 06:00 AM', active: false, tag: 'Dining Closed // Night Curfew Active' };
      }
    }

                      <span class="text-xs font-semibold text-maroon">${escapeHtml(n.category)} &bull; ${escapeHtml(n.wing === 'All' ? 'All Hostels' : n.wing + ' Hostel')}</span>
                      <span class="text-xs text-slate-500">${escapeHtml(n.date)}</span>
                    </div>
                    <h4 class="font-serif-college text-sm font-bold text-slate-900">${escapeHtml(n.title)}</h4>
                    <p class="text-xs text-slate-700 mt-1 leading-relaxed">${escapeHtml(n.content)}</p>
                    <div class="mt-2 flex items-center justify-between text-xs text-slate-500">
                      <span>By: ${escapeHtml(n.postedBy)}</span>
                      <button type="button" data-delete-notice="${n.id}" class="text-red-700 font-semibold hover:underline">Delete</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      return `
        ${renderTopHeader(`Hosteler HOD / Dean Portal — ${wingLabel}`)}
        <div class="flex-1 max-w-7xl w-full mx-auto flex flex-col lg:flex-row">
          <aside class="${state.mobileMenuOpen ? 'block' : 'hidden'} lg:block w-full lg:w-64 bg-navy text-slate-100 shrink-0 no-print">
            <div class="p-4 border-b border-slate-700">
              <div class="text-xs text-amber-400 font-semibold uppercase tracking-wider">Dean / HOD Administration</div>
              <div class="font-semibold text-sm mt-1">${escapeHtml(wing)} Hostel Portal</div>
              <div class="mt-2 flex gap-1.5">
                <button type="button" data-switch-wing="Male" class="flex-1 py-1 text-xs font-semibold rounded ${wing === 'Male' ? 'bg-maroon text-white' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'}">Male</button>
                <button type="button" data-switch-wing="Female" class="flex-1 py-1 text-xs font-semibold rounded ${wing === 'Female' ? 'bg-maroon text-white' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'}">Female</button>
              </div>
            </div>
            <nav class="py-2">
              ${tabs.map(t => `
                <button type="button" data-hod-tab="${t.id}" class="w-full text-left px-4 py-3 text-sm font-medium transition-colors ${state.activeHodTab === t.id ? 'nav-item-active' : 'nav-item text-slate-200'}">
                  ${escapeHtml(t.label)}
                </button>
              `).join('')}
            </nav>
          </aside>

          <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-x-hidden">
            ${contentHtml}
          </main>
        </div>
      `;
    }

    // =========================================================================
    // RENDER & EVENT BINDING
    // =========================================================================
    function render() {
      const app = document.getElementById('app');
      if (state.view === 'landing') {
        app.innerHTML = renderLanding();
      } else if (state.view === 'student') {
        app.innerHTML = renderStudentPortal();
      } else if (state.view === 'hod') {
        app.innerHTML = renderHodPortal();
      }
      bindEvents();
    }

    function bindEvents() {
      const openCodeBtn = document.getElementById('btn-open-code');
      if (openCodeBtn) {
        openCodeBtn.addEventListener('click', openStarterCodeModal);
      }

      const resetBtn = document.getElementById('btn-reset-demo');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          state = JSON.parse(JSON.stringify(DEFAULT_STATE));
          saveState();
          render();
          showToast('Demo data has been reset.', 'info');
        });
      }

      const logoutBtn = document.getElementById('btn-logout');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          state.view = 'landing';
          state.landingMode = 'select';
          state.mobileMenuOpen = false;
          saveState();
          render();
        });
      }

      const mobileMenuBtn = document.getElementById('btn-mobile-menu');
      if (mobileMenuBtn) {
        mobileMenuBtn.addEventListener('click', () => {
          state.mobileMenuOpen = !state.mobileMenuOpen;
          render();
        });
      }

      const chooseStudent = document.getElementById('btn-choose-student');
      if (chooseStudent) {
        chooseStudent.addEventListener('click', () => {
          state.landingMode = 'student-login';
          render();
        });
      }

      const chooseHod = document.getElementById('btn-choose-hod');
      if (chooseHod) {
        chooseHod.addEventListener('click', () => {
          state.landingMode = 'hod-login';
          render();
        });
      }

      const backSelect = document.getElementById('btn-back-select');
      if (backSelect) {
        backSelect.addEventListener('click', () => {
          state.landingMode = 'select';
          render();
        });
      }

      const formStudentLogin = document.getElementById('form-student-login');
      if (formStudentLogin) {
        formStudentLogin.addEventListener('submit', (e) => {
          e.preventDefault();
          const sel = document.getElementById('login-student-select').value;
          state.currentStudentId = sel;
          state.view = 'student';
          state.activeStudentTab = 'overview';
          saveState();
          render();
          showToast('Signed in to Hosteler Portal.');
        });
      }

      document.querySelectorAll('input[name="hod-wing"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          state.currentHodWing = e.target.value;
          render();
        });
      });

      const formHodLogin = document.getElementById('form-hod-login');
      if (formHodLogin) {
        formHodLogin.addEventListener('submit', (e) => {
          e.preventDefault();
          state.view = 'hod';
          state.activeHodTab = 'applications';
          saveState();
          render();
          showToast(`Signed in to ${state.currentHodWing} Hostel HOD/Dean Portal.`);
        });
      }

      document.querySelectorAll('[data-student-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeStudentTab = btn.getAttribute('data-student-tab');
          state.mobileMenuOpen = false;
          saveState();
          render();
        });
      });

      const formStudentApp = document.getElementById('form-student-application');
      if (formStudentApp) {
        formStudentApp.addEventListener('submit', (e) => {
          e.preventDefault();
          const student = state.hostelers.find(h => h.id === state.currentStudentId);
          const newApp = {
            id: 'APP-2026-' + String(Math.floor(100 + Math.random() * 899)),
            studentId: student.id,
            studentName: student.name,
            rollNo: student.rollNo,
            roomNo: student.roomNo,
            wing: student.wing,
            type: document.getElementById('app-type').value,
            subject: document.getElementById('app-subject').value.trim(),
            fromDate: document.getElementById('app-from').value,
            toDate: document.getElementById('app-to').value,
            reason: document.getElementById('app-reason').value.trim(),
            status: 'Pending',
            submittedAt: new Date().toLocaleString(),
            hodRemark: ''
          };
          state.applications.unshift(newApp);
          saveState();
          render();
          showToast('Application sent to Hostel Dean / HOD for approval.');
        });
      }

      document.querySelectorAll('[data-hod-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeHodTab = btn.getAttribute('data-hod-tab');
          state.mobileMenuOpen = false;
          saveState();
          render();
        });
      });

      document.querySelectorAll('[data-switch-wing]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentHodWing = btn.getAttribute('data-switch-wing');
          saveState();
          render();
          showToast(`Switched to ${state.currentHodWing} Hostel Portal.`, 'info');
        });
      });

      document.querySelectorAll('[data-app-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.appFilter = btn.getAttribute('data-app-filter');
          render();
        });
      });

      document.querySelectorAll('[data-review-app]').forEach(btn => {
        btn.addEventListener('click', () => {
          const appId = btn.getAttribute('data-review-app');
          const action = btn.getAttribute('data-action');
          const appObj = state.applications.find(a => a.id === appId);
          if (!appObj) return;
          openModal(`
            <h3 class="font-serif-college text-lg font-bold text-navy mb-2">${escapeHtml(action)} Application (${escapeHtml(appObj.id)})</h3>
            <p class="text-xs text-slate-600 mb-3">Applicant: <strong>${escapeHtml(appObj.studentName)}</strong> &bull; ${escapeHtml(appObj.subject)}</p>
            <form id="form-hod-remark" class="space-y-3 text-sm">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Dean / HOD Remark (Optional)</label>
                <textarea id="hod-remark-input" rows="3" placeholder="Add approval instructions or reason for rejection..." class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-navy">${escapeHtml(appObj.hodRemark)}</textarea>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded text-slate-700 font-medium">Cancel</button>
                <button type="submit" class="px-4 py-2 ${action === 'Approved' ? 'bg-emerald-700 hover:bg-emerald-800' : 'bg-red-700 hover:bg-red-800'} text-white font-semibold rounded">
                  Confirm ${escapeHtml(action)}
                </button>
              </div>
            </form>
          `);
          document.getElementById('form-hod-remark').addEventListener('submit', (e) => {
            e.preventDefault();
            appObj.status = action;
            appObj.hodRemark = document.getElementById('hod-remark-input').value.trim();
            closeModal();
            saveState();
            render();
            showToast(`Application ${appObj.id} marked as ${action}.`);
          });
        });
      });

      const dirSearch = document.getElementById('input-dir-search');
      if (dirSearch) {
        dirSearch.addEventListener('input', (e) => {
          state.dirSearch = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const el = document.getElementById('input-dir-search');
          if (el) {
            el.focus();
            el.setSelectionRange(pos, pos);
          }
        });
      }

      const addHostelerBtn = document.getElementById('btn-add-hosteler');
      if (addHostelerBtn) {
        addHostelerBtn.addEventListener('click', () => {
          const wing = state.currentHodWing;
          openModal(`
            <h3 class="font-serif-college text-lg font-bold text-navy mb-3">Allot / Add New Hosteler (${escapeHtml(wing)} Hostel)</h3>
            <form id="form-new-hosteler" class="space-y-3 text-sm">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
                  <input type="text" id="nh-name" required class="w-full border border-slate-300 rounded px-3 py-1.5" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Roll Number</label>
                  <input type="text" id="nh-roll" required placeholder="MPGI/25/..." class="w-full border border-slate-300 rounded px-3 py-1.5" />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Course &amp; Year</label>
                  <input type="text" id="nh-course" required placeholder="B.Tech CSE — 1st Year" class="w-full border border-slate-300 rounded px-3 py-1.5" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Room No.</label>
                  <input type="text" id="nh-room" required placeholder="e.g., A-102" class="w-full border border-slate-300 rounded px-3 py-1.5" />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Mobile Number</label>
                  <input type="text" id="nh-mobile" required placeholder="+91 98..." class="w-full border border-slate-300 rounded px-3 py-1.5" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                  <input type="email" id="nh-email" required placeholder="student@mpgi.edu.in" class="w-full border border-slate-300 rounded px-3 py-1.5" />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Parent Name</label>
                  <input type="text" id="nh-pname" required class="w-full border border-slate-300 rounded px-3 py-1.5" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Parent Contact</label>
                  <input type="text" id="nh-pcontact" required placeholder="+91 94..." class="w-full border border-slate-300 rounded px-3 py-1.5" />
                </div>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded text-slate-700">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-navy text-white font-semibold rounded">Save Hosteler</button>
              </div>
            </form>
          `);
          document.getElementById('form-new-hosteler').addEventListener('submit', (e) => {
            e.preventDefault();
            const room = document.getElementById('nh-room').value.trim();
            state.hostelers.push({
              id: 'STU-' + wing[0] + '-' + Math.floor(300 + Math.random() * 600),
              rollNo: document.getElementById('nh-roll').value.trim(),
              name: document.getElementById('nh-name').value.trim(),
              wing: wing,
              hostelName: wing === 'Male' ? "Vivekananda Boys' Hostel" : "Gargi Girls' Hostel",
              block: 'Main Block',
              roomNo: room,
              bedNo: 'Bed 1',
              roommates: [],
              allotted: room.toLowerCase() !== 'unassigned',
              course: document.getElementById('nh-course').value.trim(),
              mobile: document.getElementById('nh-mobile').value.trim(),
              email: document.getElementById('nh-email').value.trim(),
              parentName: document.getElementById('nh-pname').value.trim(),
              parentContact: document.getElementById('nh-pcontact').value.trim(),
              warden: wing === 'Male' ? 'Dr. S. K. Tiwari (+91 94150 11223)' : 'Prof. Meenakshi Joshi (+91 94150 77889)',
              messStatus: 'Active (Paid)',
              password: '123'
            });
            closeModal();
            saveState();
            render();
            showToast('New hosteler added and room allotted.');
          });
        });
      }

      document.querySelectorAll('[data-edit-room]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-room');
          const h = state.hostelers.find(x => x.id === id);
          if (!h) return;
          openModal(`
            <div class="border-b border-slate-200 pb-3 mb-4 flex items-center justify-between">
              <div>
                <h3 class="font-serif-college text-lg font-bold text-navy">Allot / Update Room — ${escapeHtml(h.name)}</h3>
                <p class="text-xs text-slate-500">${escapeHtml(h.rollNo)} &bull; ${escapeHtml(h.course)} &bull; ${escapeHtml(h.wing)} Hostel</p>
              </div>
              <span class="text-xs px-2.5 py-1 rounded font-semibold ${h.allotted ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                ${h.allotted ? 'Currently Allotted' : 'Pending Allotment'}
              </span>
            </div>

            <form id="form-edit-hosteler" class="space-y-4 text-xs">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Room Number *</label>
                  <input type="text" id="eh-room" value="${escapeHtml(h.roomNo)}" required placeholder="e.g. A-204 (or Unassigned)" class="w-full border border-slate-300 rounded px-3 py-1.5 text-xs focus:outline-none focus:border-navy" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Bed Assignment *</label>
                  <select id="eh-bed" class="w-full border border-slate-300 rounded px-3 py-1.5 text-xs bg-white">
                    <option value="Bed 1 (Window Side)" ${(h.bedNo || '').includes('Bed 1') ? 'selected' : ''}>Bed 1 (Window Side)</option>
                    <option value="Bed 2 (Door Side)" ${(h.bedNo || '').includes('Bed 2') ? 'selected' : ''}>Bed 2 (Door Side)</option>
                    <option value="Bed 3 (Single/Balcony)" ${(h.bedNo || '').includes('Bed 3') ? 'selected' : ''}>Bed 3 (Single / Balcony)</option>
                    <option value="-" ${h.bedNo === '-' ? 'selected' : ''}>- (Unassigned)</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Block / Floor *</label>
                  <input type="text" id="eh-block" value="${escapeHtml(h.block)}" required placeholder="e.g. Block A — 2nd Floor" class="w-full border border-slate-300 rounded px-3 py-1.5 text-xs" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Hostel Building *</label>
                  <select id="eh-hostel" class="w-full border border-slate-300 rounded px-3 py-1.5 text-xs bg-white">
                    <option value="Vivekananda Boys' Hostel" ${h.hostelName === "Vivekananda Boys' Hostel" ? 'selected' : ''}>Vivekananda Boys' Hostel</option>
                    <option value="Gargi Girls' Hostel" ${h.hostelName === "Gargi Girls' Hostel" ? 'selected' : ''}>Gargi Girls' Hostel</option>
                  </select>
                </div>
              </div>

              <div>
                <label class="block font-semibold text-slate-700 mb-1">Roommate(s) (Comma-separated)</label>
                <input type="text" id="eh-roommates" value="${escapeHtml((h.roommates || []).join(', '))}" placeholder="e.g. Rohan Verma (MPGI/24/CS/058)" class="w-full border border-slate-300 rounded px-3 py-1.5 text-xs" />
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Allotment Status *</label>
                  <select id="eh-allotted" class="w-full border border-slate-300 rounded px-3 py-1.5 text-xs bg-white">
                    <option value="true" ${h.allotted ? 'selected' : ''}>Room Allotted (Active Resident)</option>
                    <option value="false" ${!h.allotted ? 'selected' : ''}>Pending Allotment / On Hold</option>
                  </select>
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Mess Account Status *</label>
                  <select id="eh-mess" class="w-full border border-slate-300 rounded px-3 py-1.5 text-xs bg-white">
                    <option value="Active (Paid)" ${(h.messStatus || '').includes('Paid') ? 'selected' : ''}>Active (Paid) — Central Dining</option>
                    <option value="Pending Fees" ${(h.messStatus || '').includes('Pending') ? 'selected' : ''}>Pending Fees Verification</option>
                    <option value="Exempted" ${(h.messStatus || '').includes('Exempted') ? 'selected' : ''}>Exempted / Day Scholar</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Student Mobile Number</label>
                  <input type="text" id="eh-mobile" value="${escapeHtml(h.mobile)}" required class="w-full border border-slate-300 rounded px-3 py-1.5 text-xs" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Student Email Address</label>
                  <input type="email" id="eh-email" value="${escapeHtml(h.email)}" required class="w-full border border-slate-300 rounded px-3 py-1.5 text-xs" />
                </div>
              </div>

              <div>
                <label class="block font-semibold text-slate-700 mb-1">Parent / Emergency Contact</label>
                <input type="text" id="eh-pcontact" value="${escapeHtml(h.parentContact || '')}" class="w-full border border-slate-300 rounded px-3 py-1.5 text-xs" />
              </div>

              <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded text-slate-700 hover:bg-slate-50 font-medium">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-navy hover:bg-navy-dark text-white font-semibold rounded shadow-sm">
                  Save Allotment Record
                </button>
              </div>
            </form>
          `);

          document.getElementById('form-edit-hosteler').addEventListener('submit', async (e) => {
            e.preventDefault();
            const roomVal = document.getElementById('eh-room').value.trim();
            const bedVal = document.getElementById('eh-bed').value;
            const blockVal = document.getElementById('eh-block').value.trim();
            const hostelVal = document.getElementById('eh-hostel').value;
            const isAllotted = document.getElementById('eh-allotted').value === 'true' && roomVal.toLowerCase() !== 'unassigned' && roomVal !== '';
            const rawRoommates = document.getElementById('eh-roommates').value.trim();
            const roommatesArr = rawRoommates ? rawRoommates.split(',').map(s => s.trim()).filter(Boolean) : [];
            const messVal = document.getElementById('eh-mess').value;
            const mobileVal = document.getElementById('eh-mobile').value.trim();
            const emailVal = document.getElementById('eh-email').value.trim();
            const pContactVal = document.getElementById('eh-pcontact').value.trim();

            h.roomNo = roomVal;
            h.bedNo = bedVal;
            h.block = blockVal;
            h.hostelName = hostelVal;
            h.allotted = isAllotted;
            h.roommates = roommatesArr;
            h.messStatus = messVal;
            h.mobile = mobileVal;
            h.email = emailVal;
            if (pContactVal) h.parentContact = pContactVal;
            if (isAllotted && !h.allotmentDate) h.allotmentDate = new Date().toISOString().slice(0, 10);

            // API Sync if online
            if (window.location.protocol.startsWith('http')) {
              try {
                await apiRequest('/api/hostelers/' + encodeURIComponent(h.id) + '/allot', 'PUT', {
                  roomNo: h.roomNo,
                  bedNo: h.bedNo,
                  block: h.block,
                  hostelName: h.hostelName,
                  roommates: h.roommates,
                  messStatus: h.messStatus
                });
              } catch(err) {
                console.warn('API sync deferred to local state:', err);
              }
            }

            closeModal();
            saveState();
            render();
            showToast(`Room allotment updated for ${h.name} (${h.roomNo}).`);
          });
        });
      });

      document.querySelectorAll('[data-att-sub]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.attendanceSubTab = btn.getAttribute('data-att-sub');
          render();
        });
      });

      const attDate = document.getElementById('att-date-picker');
      if (attDate) {
        attDate.addEventListener('change', (e) => {
          state.attendanceDate = e.target.value;
          render();
        });
      }

      const markAllPresent = document.getElementById('btn-mark-all-present');
      if (markAllPresent) {
        markAllPresent.addEventListener('click', () => {
          document.querySelectorAll('#form-mark-attendance input[type="radio"][value="Present"]').forEach(r => {
            r.checked = true;
          });
        });
      }

      const formMarkAtt = document.getElementById('form-mark-attendance');
      if (formMarkAtt) {
        formMarkAtt.addEventListener('submit', (e) => {
          e.preventDefault();
          const date = document.getElementById('att-date-picker').value;
          if (!state.attendanceRecords[date]) state.attendanceRecords[date] = {};
          const wingHostelers = state.hostelers.filter(h => h.wing === state.currentHodWing);
          wingHostelers.forEach(h => {
            const checked = document.querySelector(`input[name="att-${h.id}"]:checked`);
            if (checked) {
              state.attendanceRecords[date][h.id] = checked.value;
            }
          });
          saveState();
          render();
          showToast(`Attendance saved for ${date}.`);
        });
      }

      const formUploadTT = document.getElementById('form-upload-timetable');
      if (formUploadTT) {
        formUploadTT.addEventListener('submit', (e) => {
          e.preventDefault();
          state.timetable.push({
            id: 'TT-' + Date.now(),
            time: document.getElementById('tt-time').value.trim(),

                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Hostel Building *</label>
                  <input type="text" id="ar-hostel" required value="${reg.hostelName}" class="w-full border border-slate-300 rounded px-3 py-1.5 bg-slate-50" readonly />
                </div>
              </div>

              <div>
                <label class="block font-semibold text-slate-700 mb-1">Assign Roommate(s) (Optional, comma-separated)</label>
                <input type="text" id="ar-roommates" placeholder="e.g. Rohan Verma (MPGI/24/CS/058)" class="w-full border border-slate-300 rounded px-3 py-1.5 bg-white" />
              </div>

              <div>
                <label class="block font-semibold text-slate-700 mb-1">HOD / Warden Verification Remarks</label>
                <textarea id="ar-remark" rows="2" class="w-full border border-slate-300 rounded p-2 focus:outline-none focus:border-navy bg-white" placeholder="Fee receipt verified against bank records. Room and bed allocated.">Fee receipt verified from Accounts Office. Room and bed allocated for Academic Session 2026–27.</textarea>
              </div>

              <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded text-slate-700">Cancel</button>
                <button type="submit" class="px-5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded shadow-sm">
                  Confirm Allotment &amp; Activate Account
                </button>
              </div>
            </form>
          `);

          document.getElementById('form-confirm-allot').addEventListener('submit', async (e) => {
            e.preventDefault();
            const roomVal = document.getElementById('ar-room').value.trim();
            const bedVal = document.getElementById('ar-bed').value;
            const blockVal = document.getElementById('ar-block').value.trim();
            const hostelVal = document.getElementById('ar-hostel').value.trim();
            const rawRoommates = document.getElementById('ar-roommates').value.trim();
            const roommatesArr = rawRoommates ? rawRoommates.split(',').map(s => s.trim()).filter(Boolean) : [];
            const remarkVal = document.getElementById('ar-remark').value.trim();

            reg.status = 'Approved';
            reg.allottedRoom = roomVal;
            reg.allottedBed = bedVal;
            reg.hodRemark = remarkVal;

            // Automatically create active Hosteler profile
            const newHosteler = {
              id: 'STU-' + (reg.wing === 'Female' ? 'F-' : 'M-') + Math.floor(300 + Math.random() * 600),
              rollNo: reg.rollNo,
              name: reg.name,
              wing: reg.wing,
              hostelName: hostelVal || reg.hostelName,
              block: blockVal,
              roomNo: roomVal,
              bedNo: bedVal,
              roommates: roommatesArr,
              allotted: true,
              allotmentDate: new Date().toISOString().slice(0, 10),
              course: reg.course || reg.branch,
              mobile: reg.mobile,
              email: reg.email,
              parentName: reg.parentName,
              parentContact: reg.parentContact,
              warden: reg.wing === 'Female' ? 'Prof. Meenakshi Joshi (+91 94150 77889)' : 'Dr. S. K. Tiwari (+91 94150 11223)',
              messStatus: 'Active (Paid)',
              messCardNo: 'MPGI-MESS-2026-' + roomVal,
              password: reg.password || '123'
            };

            // Avoid duplicate roll numbers
            const existingIdx = state.hostelers.findIndex(h => h.rollNo === reg.rollNo);
            if (existingIdx !== -1) {
              state.hostelers[existingIdx] = newHosteler;
            } else {
              state.hostelers.push(newHosteler);
            }

            // API Sync if online
            if (window.location.protocol.startsWith('http')) {
              try {
                await apiRequest('/api/registrations/' + encodeURIComponent(reg.id) + '/approve', 'POST', {
                  roomNo: roomVal,
                  bedNo: bedVal,
                  block: blockVal,
                  hostelName: hostelVal,
                  roommates: roommatesArr,
                  hodRemark: remarkVal
                });
              } catch(err) {
                console.warn('Approve registration API sync deferred to local state:', err);
              }
            }

            saveState();
            closeModal();
            render();
            showToast(`Room ${roomVal} allotted to ${reg.name}. Student account activated!`);
          });
        });
      });

      // HOD Reject Registration
      document.querySelectorAll('[data-reject-reg]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-reject-reg');
          const reg = (state.registrationRequests || []).find(r => r.id === id);
          if (!reg) return;

          openModal(`
            <h3 class="font-serif-college text-lg font-bold text-red-800 mb-2">Reject Registration &amp; Fee Receipt</h3>
            <p class="text-xs text-slate-600 mb-3">Applicant: <strong>${escapeHtml(reg.name)}</strong> (${escapeHtml(reg.rollNo)})</p>
            <form id="form-reject-reg" class="space-y-3 text-xs">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Reason for Rejection *</label>
                <textarea id="rej-remark" required rows="3" class="w-full border border-slate-300 rounded p-2 focus:outline-none focus:border-red-700" placeholder="e.g. Fee receipt unreadable, bank transaction reference mismatch, or partial fee paid.">Fee receipt unreadable or transaction reference mismatch. Please upload a clear bank deposit slip.</textarea>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded text-slate-700">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-red-700 text-white font-semibold rounded">Confirm Rejection</button>
              </div>
            </form>
          `);

          document.getElementById('form-reject-reg').addEventListener('submit', async (e) => {
            e.preventDefault();
            const reason = document.getElementById('rej-remark').value.trim();
            reg.status = 'Rejected';
            reg.hodRemark = reason;

            if (window.location.protocol.startsWith('http')) {
              try {
                await apiRequest('/api/registrations/' + encodeURIComponent(reg.id) + '/reject', 'POST', {
                  hodRemark: reason
                });
              } catch(err) {
                console.warn('Reject registration API sync deferred to local state:', err);
              }
            }

            saveState();
            closeModal();
            render();
            showToast(`Registration for ${reg.name} marked as rejected.`, 'info');
          });
        });
      });

      // Menu Day Selector
      document.querySelectorAll('[data-menu-day]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedMenuDay = btn.getAttribute('data-menu-day');
          render();
        });
      });

      // Timetable Category Filter
      document.querySelectorAll('[data-tt-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.timetableCategoryFilter = btn.getAttribute('data-tt-cat');
          render();
        });
      });

      // Allotment Filter in HOD Directory
      document.querySelectorAll('[data-allot-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.allotmentFilter = btn.getAttribute('data-allot-filter');
          render();
        });
      });

      // HOD Timetable Subtab (Routine vs Mess)
      document.querySelectorAll('[data-hod-tt-sub]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.hodTimetableTab = btn.getAttribute('data-hod-tt-sub');
          render();
        });
      });

      // Print Official Allotment Slip Modal
      const btnPrintSlip = document.getElementById('btn-print-slip');
      if (btnPrintSlip) {
        btnPrintSlip.addEventListener('click', () => {
          const student = state.hostelers.find(h => h.id === state.currentStudentId) || state.hostelers[0];
          openModal(`
            <div id="print-slip-area" class="p-6 bg-white border-2 border-navy rounded font-sans">
              <!-- Institutional Header -->
              <div class="border-b-2 border-navy pb-4 mb-4 text-center">
                <div class="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Maharana Pratap Group of Institutions (MPGI)</div>
                <h2 class="font-serif-college text-xl font-bold text-navy mt-1">DIRECTORATE OF HOSTEL RESIDENTIAL AFFAIRS</h2>
                <div class="text-xs text-slate-600 mt-0.5">Kothi, Mandhana, Kanpur, Uttar Pradesh — 209217 &bull; Session 2026–27</div>
                <div class="inline-block bg-navy text-white text-xs font-bold px-4 py-1 rounded mt-2 uppercase tracking-wide">
                  Official Hostel Room Allotment Certificate
                </div>
              </div>

              <!-- Student & Allotment Grid -->
              <div class="grid grid-cols-2 gap-4 text-xs mb-4 p-3 bg-slate-50 rounded border border-slate-200">
                <div>
                  <span class="text-slate-500 font-semibold">Resident Name:</span>
                  <div class="font-bold text-slate-900 text-sm mt-0.5">${escapeHtml(student.name)}</div>
                </div>
                <div>
                  <span class="text-slate-500 font-semibold">University Roll No:</span>
                  <div class="font-bold text-navy font-mono text-sm mt-0.5">${escapeHtml(student.rollNo)}</div>
                </div>
                <div>
                  <span class="text-slate-500 font-semibold">Course &amp; Department:</span>
                  <div class="font-medium text-slate-800 mt-0.5">${escapeHtml(student.course)}</div>
                </div>
                <div>
                  <span class="text-slate-500 font-semibold">Residential Wing:</span>
                  <div class="font-semibold text-slate-800 mt-0.5">${escapeHtml(student.wing)} Hostel</div>
                </div>
              </div>

              <!-- Room Allocation Record -->
              <div class="border border-slate-300 rounded mb-4 overflow-hidden text-xs">
                <div class="bg-navy text-white px-3 py-1.5 font-bold uppercase text-[11px]">
                  Allotted Room &amp; Bed Particulars
                </div>
                <div class="p-3 grid grid-cols-2 md:grid-cols-3 gap-3">
                  <div>
                    <span class="text-slate-500">Hostel Building:</span>
                    <div class="font-bold text-slate-900">${escapeHtml(student.hostelName)}</div>
                  </div>
                  <div>
                    <span class="text-slate-500">Block &amp; Floor:</span>
                    <div class="font-bold text-slate-900">${escapeHtml(student.block)}</div>
                  </div>
                  <div>
                    <span class="text-slate-500">Room Number:</span>
                    <div class="font-bold text-navy text-sm">${escapeHtml(student.roomNo)}</div>
                  </div>
                  <div>
                    <span class="text-slate-500">Bed Allotment:</span>
                    <div class="font-bold text-slate-800">${escapeHtml(student.bedNo || 'Bed 1')}</div>
                  </div>
                  <div>
                    <span class="text-slate-500">Mess Subscription:</span>
                    <div class="font-bold text-emerald-700">${escapeHtml(student.messStatus)}</div>
                  </div>
                  <div>
                    <span class="text-slate-500">Mess Card ID:</span>
                    <div class="font-mono text-slate-800">${escapeHtml(student.messCardNo || 'MPGI-MESS-2026')}</div>
                  </div>
                </div>
                <div class="px-3 pb-3 pt-1 border-t border-slate-200">
                  <span class="text-slate-500">Allotted Roommate(s):</span>
                  <div class="font-medium text-slate-800">${student.roommates && student.roommates.length ? escapeHtml(student.roommates.join(', ')) : 'None assigned'}</div>
                </div>
              </div>

              <!-- Undertaking & Signatures -->
              <div class="text-[10px] text-slate-600 mb-6 bg-amber-50 p-2.5 rounded border border-amber-200">
                <strong>Hostel By-Laws Notice:</strong> The resident agrees to abide by MPGI Hostel Code of Conduct, maintain 9:00 PM roll-call attendance, adhere to the 10:00 PM gate curfew, and respect Central Dining Hall timings. No electrical appliances or unauthorized guests are permitted.
              </div>

              <div class="grid grid-cols-3 gap-4 pt-6 border-t border-slate-300 text-center text-xs">
                <div>
                  <div class="border-b border-slate-400 pb-1 mb-1 font-semibold text-slate-800">${escapeHtml(student.name)}</div>
                  <span class="text-[10px] text-slate-500 uppercase">Resident Signature</span>
                </div>
                <div>
                  <div class="border-b border-slate-400 pb-1 mb-1 font-semibold text-slate-800">Hostel Warden Office</div>
                  <span class="text-[10px] text-slate-500 uppercase">Warden Verification Stamp</span>
                </div>
                <div>
                  <div class="border-b border-slate-400 pb-1 mb-1 font-semibold text-maroon">Chief Hostel Dean</div>
                  <span class="text-[10px] text-slate-500 uppercase">Dean Residential Seal</span>
                </div>
              </div>

              <!-- Print / Close Controls -->
              <div class="flex justify-end gap-2 mt-6 pt-3 border-t border-slate-200 no-print">
                <button type="button" onclick="closeModal()" class="px-4 py-1.5 border border-slate-300 rounded text-xs text-slate-700">Close</button>
                <button type="button" onclick="window.print()" class="px-4 py-1.5 bg-navy text-white text-xs font-semibold rounded shadow">🖨️ Print Certificate</button>
              </div>
            </div>
          `);
        });
      }

      // Request Room Change Button
      const btnRequestChange = document.getElementById('btn-request-change');
      if (btnRequestChange) {
        btnRequestChange.addEventListener('click', () => {
          state.activeStudentTab = 'applications';
          render();
          setTimeout(() => {
            const typeSelect = document.getElementById('app-type');
            const subjInput = document.getElementById('app-subject');
            const reasonInput = document.getElementById('app-reason');
            if (typeSelect) typeSelect.value = 'Room Allotment / Shift';
            if (subjInput) subjInput.value = 'Request for Room Re-Allotment / Roommate Change';
            if (reasonInput) reasonInput.value = 'I would like to request an allotment update for my room due to...';
          }, 100);
        });
      }

      // HOD Mess Menu Form Submit
      const formEditMess = document.getElementById('form-edit-mess-menu');
      if (formEditMess) {
        formEditMess.addEventListener('submit', async (e) => {
          e.preventDefault();
          const day = document.getElementById('mm-day').value;
          if (!state.messMenu) state.messMenu = {};
          if (!state.messMenu[day]) state.messMenu[day] = {};

          state.messMenu[day] = {
            breakfast: {
              time: document.getElementById('mm-bf-time').value.trim(),
              items: document.getElementById('mm-bf-items').value.trim()
            },
            lunch: {
              time: document.getElementById('mm-lunch-time').value.trim(),
              items: document.getElementById('mm-lunch-items').value.trim()
            },
            snacks: {
              time: document.getElementById('mm-snack-time').value.trim(),
              items: document.getElementById('mm-snack-items').value.trim()
            },
            dinner: {
              time: document.getElementById('mm-din-time').value.trim(),
              items: document.getElementById('mm-din-items').value.trim()
            }
          };

          // API Sync if online
          if (window.location.protocol.startsWith('http')) {
            try {
              await apiRequest('/api/mess-menu/' + encodeURIComponent(day), 'PUT', state.messMenu[day]);
            } catch(err) {
              console.warn('Mess API sync deferred:', err);
            }
          }

          saveState();
          render();
          showToast(`${day} Mess & Lunch Menu updated and published.`);
        });
      }

      const formUploadNotice = document.getElementById("form-upload-notice");
      if (formUploadNotice) {
        formUploadNotice.addEventListener('submit', (e) => {
          e.preventDefault();
          state.notices.unshift({
            id: 'NOT-' + Date.now(),
            title: document.getElementById('notice-title').value.trim(),
            category: document.getElementById('notice-category').value,
            wing: document.getElementById('notice-wing').value,
            date: new Date().toISOString().slice(0, 10),
            postedBy: `HOD, ${state.currentHodWing} Hostel`,
            content: document.getElementById('notice-content').value.trim()
          });
          saveState();
          render();
          showToast('Official notice published to Hosteler Portal.');
        });
      }

      document.querySelectorAll('[data-delete-notice]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-delete-notice');
          state.notices = state.notices.filter(n => n.id !== id);
          saveState();
          render();
          showToast('Notice deleted.', 'info');
        });
      });
    }


    // Dual-Mode Sync with Node.js/Express Backend API
    async function initSync() {
      if (window.location.protocol.startsWith('http')) {
        try {
          const [hList, ttList, mmList, nList, aList, rList] = await Promise.all([
            apiRequest('/api/hostelers').catch(() => null),
            apiRequest('/api/timetable').catch(() => null),
            apiRequest('/api/mess-menu').catch(() => null),
            apiRequest('/api/notices').catch(() => null),
            apiRequest('/api/applications').catch(() => null),
            apiRequest('/api/registrations').catch(() => null)
          ]);
          if (hList && Array.isArray(hList) && hList.length) state.hostelers = hList;
          if (ttList && Array.isArray(ttList) && ttList.length) state.timetable = ttList;
          if (mmList && typeof mmList === 'object' && mmList.Monday) state.messMenu = mmList;
          if (nList && Array.isArray(nList) && nList.length) state.notices = nList;
          if (aList && Array.isArray(aList) && aList.length) state.applications = aList;
          if (rList && Array.isArray(rList) && rList.length) state.registrationRequests = rList;
          saveState();
          render();
        } catch (e) {
          console.warn('Backend sync error (running in local mode):', e);
        }
      }
    }

    render();
    initSync();

  </script>
</body>
</html>
