<!DOCTYPE html>
<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet" />

    body {

</head>
<body class="min-h-screen flex flex-col">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>

  <!-- Modal Container -->
  <div id="modal-backdrop" class="hidden fixed inset-0 bg-slate-900/60 z-40 flex items-center justify-center p-4">
    <div id="modal-content" class="bg-white border border-slate-300 rounded shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6"></div>
  </div>

  <!-- App Root -->
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    // =========================================================================
    // MPGI HOSTELER'S ERP — CLEAN LOGICAL ARCHITECTURE (ZERO FAKE DATA)
    // =========================================================================
    const STORAGE_KEY = 'mpgi_hostel_erp_v7_prod_clean';

    // Backend API Client (for Node.js/Express server.js)
    const API_CONFIG = {
      baseUrl: window.location.origin,
      apiKey: (function() { try { return localStorage.getItem('mpgi_api_key') || 'dev-mpgi-key-123'; } catch(e) { return 'dev-mpgi-key-123'; } })()
    };

    async function apiRequest(endpoint, method = 'GET', body = null) {
      const opts = {
        method,
        headers: { 'Content-Type': 'application/json', 'x-api-key': API_CONFIG.apiKey }
      };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(API_CONFIG.baseUrl + endpoint, opts);
      if (!res.ok) {
        let errData = {};
        try { errData = await res.json(); } catch(e) {}
        throw new Error(errData.error || errData.message || ('API Error: ' + res.status));
      }
      return res.json();
    }

    // Completely Clean State: zero fake students, zero fake timetable
    const DEFAULT_STATE = {
      view: 'landing', // 'landing' | 'student' | 'hod'
      landingMode: 'select', // 'select' | 'student-login' | 'hod-login'
      activeStudentTab: 'overview',
      activeHodTab: 'registrations',
      currentStudentId: null,
      currentHodWing: 'Male', // 'Male' | 'Female'
      mobileMenuOpen: false,
      appFilter: 'All',
      dirSearch: '',
      attendanceDate: new Date().toISOString().slice(0, 10),
      attendanceSubTab: 'mark', // 'mark' | 'summary'
      noticeFilter: 'All',
      regFilter: 'All',
      timetableCategoryFilter: 'All',
      allotmentFilter: 'All',
      hodTimetableTab: 'routine', // 'routine' | 'mess'
      selectedMenuDay: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()] || 'Monday',

      hostelers: [],
      registrationRequests: [],
      applications: [],
      notices: [],
      timetable: [],
      messMenu: {},
      attendanceRecords: {}
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return { ...DEFAULT_STATE, ...parsed };
        }
      } catch (e) { /* ignore storage errors */ }
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) { /* ignore storage errors */ }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'success') {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const el = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-800' : type === 'error' ? 'bg-red-800' : 'bg-slate-800';
      el.className = `${bg} text-white text-xs px-4 py-2.5 rounded shadow-lg flex items-center justify-between gap-3 transition-all duration-200 transform translate-y-2 opacity-0`;
      el.innerHTML = `<span>${escapeHtml(message)}</span><button class="font-bold text-slate-300 hover:text-white">&times;</button>`;
      el.querySelector('button').onclick = () => el.remove();
      c.appendChild(el);
      requestAnimationFrame(() => {
        el.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 200);
      }, 4000);
    }

    function openModal(contentHtml) {
      const b = document.getElementById('modal-backdrop');
      const c = document.getElementById('modal-content');
      if (!b || !c) return;
      c.innerHTML = contentHtml;
      b.classList.remove('hidden');
    }

    function closeModal() {
      const b = document.getElementById('modal-backdrop');
      if (b) b.classList.add('hidden');
    }

    window.closeModal = closeModal;

    const modalB = document.getElementById('modal-backdrop');
    if (modalB) {
      modalB.addEventListener('click', (e) => {
        if (e.target === modalB) closeModal();
      });
    }

    function getStatusBadge(status) {
      let cls = 'bg-slate-100 text-slate-800 border-slate-300';
      if (status === 'Approved' || status === 'Present' || status === 'Allotted') {
        cls = 'bg-emerald-50 text-emerald-800 border-emerald-300';
      } else if (status === 'Pending' || status === 'Pending HOD Approval' || status === 'Leave') {
        cls = 'bg-amber-50 text-amber-800 border-amber-300';
      } else if (status === 'Rejected' || status === 'Absent' || status === 'Unassigned') {
        cls = 'bg-red-50 text-red-800 border-red-300';
      }
      return `<span class="px-2.5 py-0.5 text-xs font-semibold rounded border ${cls}">${escapeHtml(status)}</span>`;
    }

    function getStudentAttendanceStats(studentId) {
      const records = state.attendanceRecords;
      let total = 0, present = 0, absent = 0, leave = 0;
      Object.keys(records).forEach(d => {
        if (records[d] && records[d][studentId]) {
          total++;
          const s = records[d][studentId];
          if (s === 'Present') present++;
          else if (s === 'Absent') absent++;
          else if (s === 'Leave') leave++;
        }
      });
      const pct = total === 0 ? 0 : Math.round((present / total) * 100);
      return { total, present, absent, leave, pct };
    }

    function getActiveMealInfo() {
      const now = new Date();
      const hrs = now.getHours();
      const mins = now.getMinutes();
      const timeVal = hrs * 60 + mins;

      // 07:30 to 08:45 = Breakfast (450 to 525)
      // 13:00 to 14:15 = Lunch (780 to 855)
      // 17:00 to 17:45 = Snacks (1020 to 1065)
      // 19:30 to 21:15 = Dinner (1170 to 1275)
      if (timeVal >= 450 && timeVal <= 525) {
        return { meal: 'Breakfast', time: '07:30 AM – 08:45 AM', active: true, tag: 'Serving Now' };
      } else if (timeVal >= 780 && timeVal <= 855) {
        return { meal: 'Lunch', time: '01:00 PM – 02:15 PM', active: true, tag: 'Serving Now (Lunch Break)' };
      } else if (timeVal >= 1020 && timeVal <= 1065) {
        return { meal: 'Evening Tea & Snacks', time: '05:00 PM – 05:45 PM', active: true, tag: 'Serving Now' };
      } else if (timeVal >= 1170 && timeVal <= 1275) {
        return { meal: 'Dinner', time: '07:30 PM – 09:15 PM', active: true, tag: 'Serving Now' };
      } else if (timeVal < 450) {
        return { meal: 'Breakfast', time: '07:30 AM – 08:45 AM', active: false, tag: 'Next: Breakfast at 07:30 AM' };
      } else if (timeVal < 780) {
        return { meal: 'Lunch', time: '01:00 PM – 02:15 PM', active: false, tag: 'Next: Lunch Break at 01:00 PM' };
      } else if (timeVal < 1020) {
        return { meal: 'Evening Tea & Snacks', time: '05:00 PM – 05:45 PM', active: false, tag: 'Next: Refreshments at 05:00 PM' };
      } else if (timeVal < 1170) {
        return { meal: 'Dinner', time: '07:30 PM – 09:15 PM', active: false, tag: 'Next: Dinner at 07:30 PM' };
      } else {
        return { meal: 'Gate Curfew & Silence', time: '10:00 PM – 06:00 AM', active: false, tag: 'Dining Closed // Night Curfew Active' };
      }
    }

    // Top Header Component

      const isHod = state.view === 'hod';
      const student = isStudent ? state.hostelers.find(h => h.id === state.currentStudentId) : null;

      return `
        <header class="bg-white border-b-2 border-navy shadow-sm sticky top-0 z-30">
          <div class="bg-navy-dark text-slate-200 text-xs py-1.5 px-4 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              <span class="font-bold tracking-wider uppercase text-amber-400">MPGI</span>

            </div>
            <div class="flex items-center gap-3 text-slate-300 text-[11px]">

              <span class="text-slate-500">•</span>

            </div>
          </div>

            <div class="flex items-center gap-3">
              <div class="w-10 h-10 bg-navy text-amber-400 font-serif-college font-bold rounded flex items-center justify-center text-lg border border-amber-400/40 shadow-sm">
                M
              </div>
              <div>
                <h1 class="font-serif-college text-lg sm:text-xl font-bold text-navy leading-tight">
                  MPGI Hosteler's ERP Portal
                </h1>
                <p class="text-xs text-slate-600">${subtitle}</p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              ${isStudent && student ? `
                <div class="text-right mr-2 hidden sm:block">
                  <div class="text-xs font-bold text-navy">${escapeHtml(student.name)}</div>

                <button type="button" id="btn-logout" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold rounded border border-slate-300">

              ` : isHod ? `

                </div>
                <button type="button" id="btn-logout" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold rounded border border-slate-300">
                  Logout
                </button>
              ` : `
                <button type="button" id="btn-nav-register" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-slate-900 text-xs font-bold rounded shadow-sm flex items-center gap-1.5 transition">
                  <span>📝</span> Register &amp; Apply for Room
                </button>
              `}
            </div>
          </div>
        </header>
      `;
    }


    // =========================================================================
    // LANDING & LOGIN PORTALS (ZERO FAKE DATA, USER TYPES ROLL NO & PASSWORD)
    // =========================================================================

        `;
      } else if (mode === 'student-login') {
        leftColumnHtml = `

                  <input type="password" id="login-hod-password" placeholder="Enter HOD password (admin123)" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-maroon bg-white" />
                  <span class="text-[11px] text-slate-500 mt-0.5 block">Default Dean/HOD password: <strong>admin123</strong></span>
                </div>

                <button type="submit" class="w-full py-2.5 px-4 bg-maroon hover:bg-red-900 text-white font-semibold text-sm rounded shadow-sm transition">
                  Access HOD Administrative Portal &rarr;
                </button>
              </form>
            </div>
          </div>
        `;
      }

      const rightColumnHtml = `
        <aside class="space-y-5">
          <!-- Official Notice Board Preview -->
          <div class="college-card overflow-hidden">
            <div class="bg-navy text-white px-4 py-2.5 flex items-center justify-between">
              <h3 class="font-serif-college text-sm font-bold tracking-wide">Official Hostel Notice Board</h3>
              <span class="text-[11px] text-amber-300 font-semibold">Live Circulars</span>
            </div>
            <div class="divide-y divide-slate-200 p-4 space-y-3 text-xs">
              ${state.notices.length === 0 ? `
                <div class="py-4 text-center text-slate-500 italic text-xs">
                  No official notices published yet by the HOD / Dean.

                </div>
              `).join('')}
            </div>
          </div>

    // Attach all core DOM event handlers
    function attachEventListeners() {
      // Landing: Choose Portal Buttons
      const btnChooseStudent = document.getElementById('btn-choose-student');
      if (btnChooseStudent) {
        btnChooseStudent.addEventListener('click', () => {
          state.landingMode = 'student-login';
          render();
        });
      }

      const btnChooseHod = document.getElementById('btn-choose-hod');
      if (btnChooseHod) {
        btnChooseHod.addEventListener('click', () => {
          state.landingMode = 'hod-login';
          render();
        });
      }

      const btnBackSelect = document.getElementById('btn-back-select');
      if (btnBackSelect) {
        btnBackSelect.addEventListener('click', () => {
          state.landingMode = 'select';
          render();
        });
      }

      // Register Here Buttons
      const btnOpenRegister = document.getElementById('btn-open-register');
      if (btnOpenRegister) btnOpenRegister.addEventListener('click', openRegistrationModal);

      const btnLoginToReg = document.getElementById('btn-login-to-register');
      if (btnLoginToReg) btnLoginToReg.addEventListener('click', openRegistrationModal);

      const btnNavReg = document.getElementById('btn-nav-register');
      if (btnNavReg) btnNavReg.addEventListener('click', openRegistrationModal);

      // Student Login Form Submit (User types Roll No & Password)
      const formStudentLogin = document.getElementById('form-student-login');
      if (formStudentLogin) {
        formStudentLogin.addEventListener('submit', (e) => {
          e.preventDefault();
          const rollVal = document.getElementById('login-roll-no').value.trim();
          const passVal = document.getElementById('login-student-password').value.trim();
          const errEl = document.getElementById('login-error-msg');

          if (!rollVal || !passVal) {
            errEl.textContent = 'Please enter both your Roll Number and password.';
            errEl.classList.remove('hidden');
            return;
          }

          // Search active hostelers
          const student = (state.hostelers || []).find(h =>
            ((h.rollNo && h.rollNo.trim().toLowerCase() === rollVal.toLowerCase()) ||
             (h.id && h.id.trim().toLowerCase() === rollVal.toLowerCase())) &&
            h.password === passVal
          );

          if (student) {
            if (!student.allotted) {
              errEl.textContent = 'Your registration has been submitted, but room allotment by HOD is currently pending verification. Please check back soon.';
              errEl.classList.remove('hidden');
              return;
            }
            state.currentStudentId = student.id;
            state.view = 'student';
            state.activeStudentTab = 'overview';
            saveState();
            render();
            showToast(`Welcome back, ${student.name}!`);
            return;
          }

          // Check if registration is still pending review
          const pending = (state.registrationRequests || []).find(r =>
            r.rollNo && r.rollNo.trim().toLowerCase() === rollVal.toLowerCase()
          );

          if (pending) {
            errEl.innerHTML = `Your registration application (Tracking ID: <strong>${escapeHtml(pending.id)}</strong>) has been submitted with your fee receipt, but room allotment is currently pending HOD verification.`;
            errEl.classList.remove('hidden');

                </div>
              </div>

              <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded text-slate-700 font-medium">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-navy hover:bg-navy-dark text-white font-semibold rounded shadow-sm">Save Allotment</button>
              </div>
            </form>
          `);

          document.getElementById('form-edit-hosteler').addEventListener('submit', async (e) => {
            e.preventDefault();
            h.roomNo = document.getElementById('eh-room').value.trim();
            h.bedNo = document.getElementById('eh-bed').value.trim();
            h.block = document.getElementById('eh-block').value.trim();
            const rm = document.getElementById('eh-roommates').value.trim();
            h.roommates = rm ? rm.split(',').map(s => s.trim()).filter(Boolean) : [];
            h.mobile = document.getElementById('eh-mobile').value.trim();
            h.parentContact = document.getElementById('eh-pcontact').value.trim();
            h.allotted = Boolean(h.roomNo && h.roomNo.toLowerCase() !== 'unassigned');

            if (window.location.protocol.startsWith('http')) {
              try {
                await apiRequest('/api/hostelers/' + encodeURIComponent(h.id) + '/allot', 'PUT', {
                  roomNo: h.roomNo,
                  bedNo: h.bedNo,
                  block: h.block,
                  roommates: h.roommates
                });
              } catch(err) {}
            }

            closeModal();
            saveState();
            render();
            showToast(`Room allotment updated for ${h.name} (${h.roomNo}).`);
          });
        });
      });

      // HOD Upload Routine Timetable Slot
      const formUploadTT = document.getElementById('form-upload-timetable');
      if (formUploadTT) {
        formUploadTT.addEventListener('submit', async (e) => {
          e.preventDefault();
          const newEntry = {
            id: 'TT-' + Date.now(),
            time: document.getElementById('tt-time').value.trim(),
            activity: document.getElementById('tt-activity').value.trim(),
            category: document.getElementById('tt-category').value,
            days: document.getElementById('tt-days').value.trim(),
            location: document.getElementById('tt-location').value.trim(),
            wing: document.getElementById('tt-wing').value
          };

          if (!state.timetable) state.timetable = [];
          state.timetable.push(newEntry);

          if (window.location.protocol.startsWith('http')) {
            try { await apiRequest('/api/timetable', 'POST', newEntry); } catch(err) {}
          }

          saveState();
          render();
          showToast('Routine timetable slot published. It is now visible to hostellers.');
        });
      }

      // HOD Delete Routine Timetable Slot
      document.querySelectorAll('[data-delete-tt]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-delete-tt');
          state.timetable = state.timetable.filter(t => t.id !== id);

          if (window.location.protocol.startsWith('http')) {
            try { await apiRequest('/api/timetable/' + encodeURIComponent(id), 'DELETE'); } catch(err) {}
          }

          saveState();
          render();
          showToast('Timetable slot removed.', 'info');
        });
      });

      // HOD Edit & Save 7-Day Mess Menu
      const formEditMess = document.getElementById('form-edit-mess-menu');
      if (formEditMess) {
        formEditMess.addEventListener('submit', async (e) => {
          e.preventDefault();
          const day = document.getElementById('mm-day').value;
          if (!state.messMenu) state.messMenu = {};

          state.messMenu[day] = {
            breakfast: {
              time: document.getElementById('mm-bf-time').value.trim(),
              items: document.getElementById('mm-bf-items').value.trim()
            },
            lunch: {
              time: document.getElementById('mm-lunch-time').value.trim(),
              items: document.getElementById('mm-lunch-items').value.trim()
            },
            snacks: {
              time: document.getElementById('mm-snack-time').value.trim(),
              items: document.getElementById('mm-snack-items').value.trim()
            },
            dinner: {
              time: document.getElementById('mm-din-time').value.trim(),
              items: document.getElementById('mm-din-items').value.trim()
            }
          };

          if (window.location.protocol.startsWith('http')) {
            try {
              await apiRequest('/api/mess-menu/' + encodeURIComponent(day), 'PUT', state.messMenu[day]);
            } catch(err) {}
          }

          saveState();
          render();
          showToast(`${day} Mess & Lunch Menu published! Hostellers can now see this menu.`);
        });
      }

      // Print Official Allotment Slip Modal
      const btnPrintSlip = document.getElementById('btn-print-slip');
      if (btnPrintSlip) {
        btnPrintSlip.addEventListener('click', () => {
          const student = state.hostelers.find(h => h.id === state.currentStudentId);
          if (!student) return;

          openModal(`
            <div id="print-slip-area" class="p-6 bg-white border-2 border-navy rounded font-sans">
              <!-- Institutional Masthead -->
              <div class="border-b-2 border-navy pb-4 mb-4 text-center">
                <div class="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Maharana Pratap Group of Institutions (MPGI)</div>
                <h2 class="font-serif-college text-xl font-bold text-navy mt-1">DIRECTORATE OF HOSTEL RESIDENTIAL AFFAIRS</h2>
                <div class="text-xs text-slate-600 mt-0.5">Mandhana, Kanpur, Uttar Pradesh &bull; Academic Session 2026–27</div>
                <div class="inline-block bg-navy text-white text-xs font-bold px-4 py-1 rounded mt-2 uppercase tracking-wide">
                  Official Hostel Room Allotment Certificate
                </div>
              </div>

              <!-- Student Particulars -->
              <div class="grid grid-cols-2 gap-4 text-xs mb-4 p-3 bg-slate-50 rounded border border-slate-200">
                <div>
                  <span class="text-slate-500 font-semibold">Resident Name:</span>
                  <div class="font-bold text-slate-900 text-sm mt-0.5">${escapeHtml(student.name)}</div>
                </div>
                <div>
                  <span class="text-slate-500 font-semibold">University Roll No:</span>
                  <div class="font-bold text-navy font-mono text-sm mt-0.5">${escapeHtml(student.rollNo)}</div>
                </div>
                <div>
                  <span class="text-slate-500 font-semibold">Course &amp; Department:</span>
                  <div class="font-medium text-slate-800 mt-0.5">${escapeHtml(student.course)}</div>
                </div>
                <div>
                  <span class="text-slate-500 font-semibold">Residential Wing:</span>
                  <div class="font-semibold text-slate-800 mt-0.5">${escapeHtml(student.wing)} Hostel</div>
                </div>
              </div>

              <!-- Allotted Room & Bed -->
              <div class="border border-slate-300 rounded mb-4 overflow-hidden text-xs">
                <div class="bg-navy text-white px-3 py-1.5 font-bold uppercase text-[11px]">
                  Allotted Room &amp; Bed Particulars
                </div>
                <div class="p-3 grid grid-cols-2 md:grid-cols-3 gap-3">
                  <div>
                    <span class="text-slate-500">Hostel Building:</span>
                    <div class="font-bold text-slate-900">${escapeHtml(student.hostelName)}</div>
                  </div>
                  <div>
                    <span class="text-slate-500">Block &amp; Floor:</span>
                    <div class="font-bold text-slate-900">${escapeHtml(student.block)}</div>
                  </div>
                  <div>
                    <span class="text-slate-500">Room Number:</span>
                    <div class="font-bold text-navy text-sm">${escapeHtml(student.roomNo)}</div>
                  </div>
                  <div>
                    <span class="text-slate-500">Bed Assignment:</span>
                    <div class="font-bold text-slate-800">${escapeHtml(student.bedNo || 'Bed 1')}</div>
                  </div>
                  <div>
                    <span class="text-slate-500">Mess Account:</span>
                    <div class="font-bold text-emerald-700">${escapeHtml(student.messStatus)}</div>
                  </div>
                  <div>
                    <span class="text-slate-500">Mess Card ID:</span>
                    <div class="font-mono text-slate-800">${escapeHtml(student.messCardNo || 'Active')}</div>
                  </div>
                </div>
                <div class="px-3 pb-3 pt-1 border-t border-slate-200">
                  <span class="text-slate-500">Roommate(s):</span>
                  <div class="font-medium text-slate-800">${student.roommates && student.roommates.length ? escapeHtml(student.roommates.join(', ')) : 'None assigned yet'}</div>
                </div>
              </div>

              <!-- Undertaking & Signatures -->
              <div class="text-[10px] text-slate-600 mb-6 bg-amber-50 p-2.5 rounded border border-amber-200">
                <strong>Hostel By-Laws Notice:</strong> The resident agrees to abide by MPGI Hostel Code of Conduct, maintain 9:15 PM biometric roll-call attendance, adhere to the 10:00 PM gate curfew, and respect Central Dining Hall timings.
              </div>

              <div class="grid grid-cols-3 gap-4 pt-6 border-t border-slate-300 text-center text-xs">
                <div>
                  <div class="border-b border-slate-400 pb-1 mb-1 font-semibold text-slate-800">${escapeHtml(student.name)}</div>
                  <span class="text-[10px] text-slate-500 uppercase">Resident Signature</span>
                </div>
                <div>
                  <div class="border-b border-slate-400 pb-1 mb-1 font-semibold text-slate-800">Hostel Warden Office</div>
                  <span class="text-[10px] text-slate-500 uppercase">Warden Stamp</span>
                </div>
                <div>
                  <div class="border-b border-slate-400 pb-1 mb-1 font-semibold text-maroon">Chief Hostel Dean</div>
                  <span class="text-[10px] text-slate-500 uppercase">Dean Residential Seal</span>
                </div>
              </div>

              <div class="flex justify-end gap-2 mt-6 pt-3 border-t border-slate-200 no-print">
                <button type="button" onclick="closeModal()" class="px-4 py-1.5 border border-slate-300 rounded text-xs text-slate-700">Close</button>
                <button type="button" onclick="window.print()" class="px-4 py-1.5 bg-navy text-white text-xs font-semibold rounded shadow">🖨️ Print Slip</button>
              </div>
            </div>
          `);
        });
      }

      // Request Room Change Button
      const btnRequestChange = document.getElementById('btn-request-change');
      if (btnRequestChange) {
        btnRequestChange.addEventListener('click', () => {
          state.activeStudentTab = 'applications';
          render();
          setTimeout(() => {
            const typeSelect = document.getElementById('app-type');
            const subjInput = document.getElementById('app-subject');
            const reasonInput = document.getElementById('app-reason');
            if (typeSelect) typeSelect.value = 'Room Allotment / Shift';
            if (subjInput) subjInput.value = 'Request for Room Re-Allotment / Roommate Shift';
            if (reasonInput) reasonInput.value = 'I would like to request an allotment update for my room...';
          }, 100);
        });
      }

      // Student Submit Application Form
      const formSubmitApp = document.getElementById('form-submit-app');
      if (formSubmitApp) {
        formSubmitApp.addEventListener('submit', async (e) => {
          e.preventDefault();
          const student = state.hostelers.find(h => h.id === state.currentStudentId);
          if (!student) return;

          const newApp = {
            id: 'APP-2026-' + Math.floor(100 + Math.random() * 899),
            studentId: student.id,
            studentName: student.name,
            rollNo: student.rollNo,
            roomNo: student.roomNo,
            wing: student.wing,
            type: document.getElementById('app-type').value,
            subject: document.getElementById('app-subject').value.trim(),
            fromDate: document.getElementById('app-from').value,
            toDate: document.getElementById('app-to').value,
            reason: document.getElementById('app-reason').value.trim(),
            status: 'Pending',
            submittedAt: new Date().toLocaleString(),
            hodRemark: ''
          };

          if (!state.applications) state.applications = [];
          state.applications.unshift(newApp);

          if (window.location.protocol.startsWith('http')) {
            try { await apiRequest('/api/applications', 'POST', newApp); } catch(err) {}
          }

          saveState();
          render();
          showToast('Application submitted to the Dean for approval.');
        });
      }

      // HOD Review Application (Approve / Reject)
      document.querySelectorAll('[data-review-app]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-review-app');
          const action = btn.getAttribute('data-action');
          const a = (state.applications || []).find(x => x.id === id);
          if (!a) return;

          const remark = prompt(`Enter Dean/HOD remark for ${action.toLowerCase()}:`, action === 'Approved' ? 'Approved by Hostel Dean.' : 'Rejected due to academic schedule.');
          if (remark === null) return;

          a.status = action;
          a.hodRemark = remark;

          if (window.location.protocol.startsWith('http')) {
            try {
              await apiRequest('/api/applications/' + encodeURIComponent(id), 'PATCH', {
                status: action,
                hodRemark: remark
              });
            } catch(err) {}
          }

          saveState();
          render();
          showToast(`Application marked as ${action}.`);
        });
      });

      // Attendance SubTab Selector
      document.querySelectorAll('[data-att-sub]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.attendanceSubTab = btn.getAttribute('data-att-sub');
          render();
        });
      });

      const attDate = document.getElementById('att-date-picker');
      if (attDate) {
        attDate.addEventListener('change', (e) => {
          state.attendanceDate = e.target.value;
          render();
        });
      }

      const markAllPresent = document.getElementById('btn-mark-all-present');
      if (markAllPresent) {
        markAllPresent.addEventListener('click', () => {
          document.querySelectorAll('#form-mark-attendance input[type="radio"][value="Present"]').forEach(r => {
            r.checked = true;
          });
        });
      }

      const formMarkAtt = document.getElementById('form-mark-attendance');
      if (formMarkAtt) {
        formMarkAtt.addEventListener('submit', async (e) => {
          e.preventDefault();
          const date = document.getElementById('att-date-picker').value;
          if (!state.attendanceRecords) state.attendanceRecords = {};
          if (!state.attendanceRecords[date]) state.attendanceRecords[date] = {};

          const wingHostelers = (state.hostelers || []).filter(h => h.wing === state.currentHodWing);
          const recordsToSave = {};

          wingHostelers.forEach(h => {
            const checked = document.querySelector(`input[name="att-${h.id}"]:checked`);
            if (checked) {
              state.attendanceRecords[date][h.id] = checked.value;
              recordsToSave[h.id] = checked.value;
            }
          });

          if (window.location.protocol.startsWith('http')) {
            try {
              await apiRequest('/api/attendance', 'POST', { date, records: recordsToSave });
            } catch(err) {}
          }

          saveState();
          render();
          showToast(`Attendance saved for ${date}.`);
        });
      }

      // HOD Upload Notice Form
      const formUploadNotice = document.getElementById('form-upload-notice');
      if (formUploadNotice) {
        formUploadNotice.addEventListener('submit', async (e) => {
          e.preventDefault();
          const newNotice = {
            id: 'NOT-' + Date.now(),
            title: document.getElementById('notice-title').value.trim(),
            category: document.getElementById('notice-category').value,
            wing: document.getElementById('notice-wing').value,
            date: new Date().toISOString().slice(0, 10),
            postedBy: `HOD, ${state.currentHodWing} Hostel`,
            content: document.getElementById('notice-content').value.trim()
          };

          if (!state.notices) state.notices = [];
          state.notices.unshift(newNotice);

          if (window.location.protocol.startsWith('http')) {
            try { await apiRequest('/api/notices', 'POST', newNotice); } catch(err) {}
          }

          saveState();
          render();
          showToast('Official notice published to student portals.');
        });
      }

      // HOD Delete Notice
      document.querySelectorAll('[data-delete-notice]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-delete-notice');
          state.notices = state.notices.filter(n => n.id !== id);

          if (window.location.protocol.startsWith('http')) {
            try { await apiRequest('/api/notices/' + encodeURIComponent(id), 'DELETE'); } catch(err) {}
          }

          saveState();
          render();
          showToast('Notice deleted.', 'info');
        });
      });
    }

    // Main Master Render Function
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (state.view === 'landing') {
        app.innerHTML = renderLanding();
      } else if (state.view === 'student') {
        app.innerHTML = renderStudentPortal();
      } else if (state.view === 'hod') {
        app.innerHTML = renderHodPortal();
      }

      attachEventListeners();
    }

    // Dual-Mode Sync with Node.js/Express Backend API
    async function initSync() {
      if (window.location.protocol.startsWith('http')) {
        try {
          const [hList, ttList, mmList, nList, aList, rList] = await Promise.all([
            apiRequest('/api/hostelers').catch(() => null),
            apiRequest('/api/timetable').catch(() => null),
            apiRequest('/api/mess-menu').catch(() => null),
            apiRequest('/api/notices').catch(() => null),
            apiRequest('/api/applications').catch(() => null),
            apiRequest('/api/registrations').catch(() => null)
          ]);
          if (hList && Array.isArray(hList)) state.hostelers = hList;
          if (ttList && Array.isArray(ttList)) state.timetable = ttList;
          if (mmList && typeof mmList === 'object') state.messMenu = mmList;
          if (nList && Array.isArray(nList)) state.notices = nList;
          if (aList && Array.isArray(aList)) state.applications = aList;
          if (rList && Array.isArray(rList)) state.registrationRequests = rList;
          saveState();
          render();
        } catch (e) {
          console.warn('Backend sync deferred (running in local storage mode):', e);
        }
      }
    }

    render();
    initSync();
  </script>
</body>
</html>
